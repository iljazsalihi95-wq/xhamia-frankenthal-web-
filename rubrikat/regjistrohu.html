<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Regjistrohu / Hyr · Xhamia Frankenthal</title><link rel="stylesheet" href="../premium-home.css"><style>body{background:#f7f5ee}.account{max-width:850px;margin:35px auto;padding:22px}.account h1{font-family:Georgia,serif}.forms{display:grid;grid-template-columns:1fr 1fr;gap:22px}form,#profile{background:white;padding:24px;border:1px solid #dac49b;border-radius:18px}label{display:block;margin:12px 0}input,select{display:block;width:100%;padding:12px;border:1px solid #aabcb4;border-radius:8px;font:inherit}input[type=checkbox]{display:inline;width:auto}button{padding:12px 18px;background:#063b34;color:white;border:0;border-radius:8px;font:inherit}.account nav{display:flex;gap:20px;flex-wrap:wrap}#status{min-height:25px;overflow-wrap:anywhere}#resource{margin:20px 0}[hidden]{display:none!important}@media(max-width:600px){.forms{grid-template-columns:1fr}.account{padding:14px}}</style></head><body><main class="account"><a href="../index.html">← Ballina</a><h1>Regjistrohu / Hyr</h1><p>Hyr me llogarinë ekzistuese të Xhamisë Frankenthal ose krijo llogari.</p><p id="status" role="status" aria-live="polite"></p><div id="guest" class="forms"><form id="login"><h2>Hyr</h2><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Fjalëkalimi<input name="password" type="password" required autocomplete="current-password"></label><button>Hyr</button></form><form id="register"><h2>Regjistrohu</h2><label>Emri<input name="emri" required autocomplete="given-name"></label><label>Mbiemri<input name="mbiemri" required autocomplete="family-name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Telefoni<input name="telefoni" type="tel" required autocomplete="tel"></label><label>Gjuha<select name="gjuha"><option>Shqip</option><option>Deutsch</option></select></label><label>Fjalëkalimi<input name="password" type="password" minlength="8" required autocomplete="new-password"></label><label>Përsërit fjalëkalimin<input name="password2" type="password" minlength="8" required autocomplete="new-password"></label><label><input type="checkbox" name="emailNjoftime"> Dëshiroj njoftime me email.</label><label><input type="checkbox" name="privatesia" required> Pranoj <a href="rregullorja.html">rregulloren</a> dhe përdorimin e të dhënave për llogarinë.</label><button>Përfundo regjistrimin</button></form></div><section id="profile" hidden><h2 id="welcome"></h2><p id="memberNumber"></p><nav><a href="?rubrika=anetaresia">Anëtarësia</a><a href="?rubrika=bilanci">Bilanci</a></nav><div id="resource"></div><button id="logout">Dil nga llogaria</button></section></main><script src="../member-account.js" defer></script></body></html>
