<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kurani</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f2f4f3;
}

/* KARTA */
.card{
  background:#ffffff;
  margin:12px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
  overflow:hidden;
}

.card h3{
  margin:0;
  padding:12px;
  font-size:16px;
  background:#1f3d3a;
  color:#fff;
  text-align:center;
}

.card iframe{
  width:100%;
  height:70vh;
  border:none;
}

/* MOBILE */
@media(max-width:900px){
  .card iframe{
    height:55vh;
  }
}
</style>
</head>

<body>

<!-- KARTA 1 – TANZIL SIPËR -->
<div class="card">
  <h3>📖 Kurani – Tekst i pastër (Tanzil)</h3>
  <iframe
    src="https://tanzil.net/"
    loading="lazy"
    referrerpolicy="no-referrer">
  </iframe>
</div>

<!-- KARTA 2 – LEXOKURAN POSHTË -->
<div class="card">
  <h3>📝 Kurani – Transkriptim & lexim (LexoKuran)</h3>
  <iframe
    src="https://lexokuran.com/"
    loading="lazy"
    referrerpolicy="no-referrer">
  </iframe>
</div>

<!-- HAPËSIRË PËR MENUNË POSHTË -->
<div style="height:120px"></div>

</body>
</html>
