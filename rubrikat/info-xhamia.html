<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administrimi – Info nga Xhamia</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Arial,sans-serif;background:linear-gradient(180deg,#073f32,#021f19);color:#fff}
.wrap{max-width:1080px;margin:auto;padding:14px}
.hero,.panel{background:#0b4b3a;border:1px solid #8c7a43;border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 10px 30px #0004}
.hero{text-align:center}
.hero h1{margin:0;color:#ffd66b;font-size:34px}
.hero p{margin:8px 0 0;color:#d8eee7}
.login{max-width:520px;margin:30px auto;background:#fff;color:#123d32;border-radius:22px;padding:20px}
h2{color:#ffd66b;margin:0 0 12px}
input,select,textarea{width:100%;padding:12px;border:1px solid #bdcec8;border-radius:12px;font-size:16px;background:#fff;color:#123d32}
textarea{min-height:150px;resize:vertical}
button{border:0;border-radius:12px;padding:12px 15px;font-size:15px;font-weight:900;cursor:pointer}
.green{background:#18875e;color:white}
.red{background:#c93443;color:white}
.gold{background:#ffd66b;color:#07372c}
.gray{background:#e8efed;color:#163f34}
.hidden{display:none!important}
.status{padding:11px 13px;border-radius:12px;background:#315d53;font-weight:800;margin:10px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin:12px 0}
.card{background:#fff;color:#123d32;border-radius:18px;padding:15px;margin-bottom:10px;border-left:6px solid #1a9d70}
.card.inactive{opacity:.7;border-left-color:#999}
.card h3{margin:0 0 7px;color:#087758}
.meta{font-size:13px;color:#677b74;margin-bottom:8px;line-height:1.5}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:800;margin:3px 3px 0 0}
.type{background:#eef2ff;color:#4338ca}
.prio{background:#fff3cd;color:#7a5b00}
.yes{background:#dcfce7;color:#166534}
.no{background:#fee2e2;color:#991b1b}
.content{line-height:1.55;margin-top:10px;white-space:pre-wrap}
.money{font-size:20px;font-weight:900;color:#087758;margin-top:8px}
.link{word-break:break-all;font-size:13px;margin-top:6px}
.note{background:#fff7d6;color:#654b00;border-radius:12px;padding:12px;line-height:1.45}
.modal{position:fixed;inset:0;background:#000b;z-index:9999;padding:14px;overflow:auto}
.modalbox{max-width:780px;margin:25px auto;background:#fff;color:#123d32;border-radius:22px;padding:18px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
label{display:block;font-weight:800;margin-top:10px;margin-bottom:4px}
@media(max-width:760px){
 .filters,.formgrid{grid-template-columns:1fr}
 .hero h1{font-size:28px}
}
</style>
</head>
<body>

<div class="wrap">

<div class="hero">
  <h1>🔐 Administrimi – Info nga Xhamia</h1>
  <p>Islamischer Verein Frankenthal · Shto / Edit / Fshi · LIVE në Google Sheet</p>
</div>

<div id="loginBox" class="login">
  <h2 style="color:#087758">Hyrje Admin</h2>
  <input id="passInput" type="password" placeholder="Password">
  <div class="actions" style="margin-top:10px">
    <button class="green" onclick="login()">🔓 Hyr</button>
  </div>
  <div id="loginStatus" class="status">Shkruaj password-in e administratorit.</div>
</div>

<div id="app" class="hidden">

  <div class="panel">
    <div class="actions">
      <button class="green" onclick="openAdd()">➕ Shto Info</button>
      <button class="gray" onclick="loadData()">🔄 Rifresko</button>
      <button class="gold" onclick="logout()">🚪 Dil</button>
    </div>

    <div id="status" class="status">⏳ Duke marrë të dhënat...</div>

    <div class="filters">
      <input id="search" placeholder="Kërko titull / përmbajtje..." oninput="render()">
      <select id="typeFilter" onchange="render()">
        <option value="all">Të gjitha llojet</option>
      </select>
      <select id="activeFilter" onchange="render()">
        <option value="all">Aktiv + Joaktiv</option>
        <option value="po">Vetëm Aktiv</option>
        <option value="jo">Vetëm Joaktiv</option>
      </select>
    </div>

    <div class="note">
      Ky panel përdor API-në Admin dhe shkruan direkt në të njëjtin Sheet “Info nga Xhamia”.
    </div>
  </div>

  <div id="list"></div>
</div>
</div>

<div id="modal" class="modal hidden">
  <div class="modalbox">
    <h2 id="formTitle" style="color:#087758">Info</h2>

    <div class="formgrid">
      <div>
        <label>ID</label>
        <input id="fId" placeholder="Lëre bosh për ID automatike">
      </div>
      <div>
        <label>Data</label>
        <input id="fData" placeholder="18.08.2026">
      </div>
    </div>

    <label>Lloji</label>
    <input id="fLloji" list="typesList" placeholder="Lloji">
    <datalist id="typesList"></datalist>

    <label>Titulli</label>
    <input id="fTitulli" placeholder="Titulli">

    <label>Përmbajtja</label>
    <textarea id="fPermbajtja" placeholder="Përmbajtja e plotë..."></textarea>

    <div class="formgrid">
      <div>
        <label>Shuma €</label>
        <input id="fShuma" type="number" step="0.01" placeholder="0.00">
      </div>
      <div>
        <label>Prioriteti</label>
        <select id="fPrioriteti">
          <option value="Lartë">Lartë</option>
          <option value="Mesëm">Mesëm</option>
          <option value="Normal">Normal</option>
          <option value="Ulët">Ulët</option>
        </select>
      </div>
    </div>

    <label>Linku</label>
    <input id="fLinku" placeholder="https://...">

    <div class="formgrid">
      <div>
        <label>Aktiv</label>
        <select id="fAktiv">
          <option value="Po">Po</option>
          <option value="Jo">Jo</option>
        </select>
      </div>
      <div>
        <label>Shënim Admin</label>
        <input id="fShenimAdmin" placeholder="Shënim vetëm për Admin">
      </div>
    </div>

    <div class="actions" style="margin-top:12px">
      <button class="green" onclick="saveForm()">💾 Ruaj në Sheet</button>
      <button class="gray" onclick="closeForm()">Mbyll</button>
    </div>
  </div>
</div>

<script>
const API='https://script.google.com/macros/s/AKfycbwdtzLV1LyRZeONlGQReKO5DenPNi8yMg-W8JOuCexsKYl0YQ3E7byHatXPGnVUgMIP/exec';
const ADMIN_PASS="Bismilah";

let ITEMS=[];
let TYPES=[];
let editing=null;

const $=id=>document.getElementById(id);

function norm(s){
  return String(s||"").trim().toLowerCase().normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/ë/g,"e")
    .replace(/ç/g,"c");
}

function euro(v){
  return Number(v||0).toLocaleString("de-DE",{maximumFractionDigits:2})+" €";
}

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g,function(m){
    return {
      "&":"&",
      "<":"<",
      ">":">",
      '"':""",
      "'":"'"
    }[m];
  });
}

function login(){
  if($("passInput").value.trim()!==ADMIN_PASS){
    $("loginStatus").textContent="❌ Password gabim.";
    return;
  }
  $("loginBox").classList.add("hidden");
  $("app").classList.remove("hidden");
  loadData();
}

function logout(){
  $("passInput").value="";
  $("app").classList.add("hidden");
  $("loginBox").classList.remove("hidden");
  $("loginStatus").textContent="Shkruaj password-in e administratorit.";
}

async function loadData(){
  $("status").textContent="⏳ Duke lexuar Info nga Xhamia...";
  try{
    const r=await fetch(API+"?action=list&t="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const d=await r.json();
    if(!d || d.success!==true) throw new Error((d&&d.error)||"Gabim API");

    ITEMS=Array.isArray(d.items)?d.items:[];
    TYPES=Array.isArray(d.llojet)?d.llojet:[];

    buildTypes();
    $("status").textContent="✅ LIVE · "+ITEMS.length+" postime";
    render();
  }catch(e){
    $("status").textContent="❌ "+e.message;
  }
}

function buildTypes(){
  const all=[...new Set(
    [...TYPES,...ITEMS.map(x=>String(x.lloji||"").trim())].filter(Boolean)
  )].sort();

  $("typeFilter").innerHTML=
    '<option value="all">Të gjitha llojet</option>'+
    all.map(t=>'<option value="'+esc(t)+'">'+esc(t)+'</option>').join("");

  $("typesList").innerHTML=
    all.map(t=>'<option value="'+esc(t)+'"></option>').join("");
}

function render(){
  const q=norm($("search").value);
  const tf=$("typeFilter").value;
  const af=$("activeFilter").value;

  let rows=ITEMS.filter(x=>{
    const searchable=(x.titulli||"")+" "+(x.permbajtja||"")+" "+(x.shenimAdmin||"");
    if(q && !norm(searchable).includes(q)) return false;
    if(tf!=="all" && String(x.lloji||"")!==tf) return false;

    const act=norm(x.aktiv)==="jo"?"jo":"po";
    if(af!=="all" && act!==af) return false;

    return true;
  });

  rows.sort((a,b)=>Number(b.id||0)-Number(a.id||0));

  $("list").innerHTML=rows.map(x=>{
    const rowNumber=Number(x.rowNumber||0);
    const active=norm(x.aktiv)==="jo"?"no":"yes";

    return '<div class="card '+(active==="no"?"inactive":"")+'">'+
      '<h3>#'+esc(x.id||"—")+' · '+esc(x.titulli||"(pa titull)")+'</h3>'+
      '<div class="meta">'+esc(x.data||"")+' · Rreshti '+esc(rowNumber)+'</div>'+
      '<span class="badge type">'+esc(x.lloji||"Pa lloj")+'</span>'+
      '<span class="badge prio">'+esc(x.prioriteti||"Normal")+'</span>'+
      '<span class="badge '+active+'">'+esc(x.aktiv||"Po")+'</span>'+
      '<div class="content">'+esc(x.permbajtja||"")+'</div>'+
      (Number(x.shuma||0)?'<div class="money">'+euro(x.shuma)+'</div>':'')+
      (x.linku?'<div class="link">🔗 '+esc(x.linku)+'</div>':'')+
      (x.shenimAdmin?'<div class="meta" style="margin-top:8px"><b>Admin:</b> '+esc(x.shenimAdmin)+'</div>':'')+
      '<div class="actions" style="margin-top:12px">'+
        '<button class="gold" onclick="openEditByRow('+rowNumber+')">✏️ Edit</button>'+
        '<button class="red" onclick="deleteItem('+rowNumber+')">🗑 Fshi</button>'+
      '</div>'+
    '</div>';
  }).join("") || '<div class="panel">Nuk ka rezultate.</div>';
}

function openAdd(){
  editing=null;
  $("formTitle").textContent="➕ Shto Info të Re";
  $("fId").value="";
  $("fData").value=new Date().toLocaleDateString("de-DE");
  $("fLloji").value="";
  $("fTitulli").value="";
  $("fPermbajtja").value="";
  $("fShuma").value="";
  $("fLinku").value="";
  $("fPrioriteti").value="Normal";
  $("fAktiv").value="Po";
  $("fShenimAdmin").value="";
  $("modal").classList.remove("hidden");
}

function openEditByRow(rowNumber){
  const x=ITEMS.find(item=>Number(item.rowNumber||0)===Number(rowNumber));

  if(!x){
    alert("❌ Nuk u gjet rreshti për editim.");
    return;
  }

  editing=x;

  $("formTitle").textContent="✏️ Edit Info · ID "+(x.id||"");
  $("fId").value=x.id||"";
  $("fData").value=x.data||"";
  $("fLloji").value=x.lloji||"";
  $("fTitulli").value=x.titulli||"";
  $("fPermbajtja").value=x.permbajtja||"";
  $("fShuma").value=Number(x.shuma||0)||"";
  $("fLinku").value=x.linku||"";
  $("fPrioriteti").value=x.prioriteti||"Normal";
  $("fAktiv").value=norm(x.aktiv)==="jo"?"Jo":"Po";
  $("fShenimAdmin").value=x.shenimAdmin||"";

  $("modal").classList.remove("hidden");
}

function closeForm(){
  $("modal").classList.add("hidden");
  editing=null;
}

async function saveForm(){
  if(!$("fLloji").value.trim()){
    alert("Shkruaj Llojin.");
    return;
  }
  if(!$("fTitulli").value.trim()){
    alert("Shkruaj Titullin.");
    return;
  }
  if(!$("fPermbajtja").value.trim()){
    alert("Shkruaj Përmbajtjen.");
    return;
  }

  const q=new URLSearchParams();

  q.set("action",editing?"update":"add");
  q.set("pass",ADMIN_PASS);

  if(editing){
    q.set("rowNumber",String(editing.rowNumber));
  }

  q.set("id",$("fId").value.trim());
  q.set("data",$("fData").value.trim());
  q.set("lloji",$("fLloji").value.trim());
  q.set("titulli",$("fTitulli").value.trim());
  q.set("permbajtja",$("fPermbajtja").value.trim());
  q.set("shuma",$("fShuma").value.trim());
  q.set("linku",$("fLinku").value.trim());
  q.set("prioriteti",$("fPrioriteti").value);
  q.set("aktiv",$("fAktiv").value);
  q.set("shenimAdmin",$("fShenimAdmin").value.trim());

  try{
    const r=await fetch(API+"?"+q.toString()+"&t="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);

    const d=await r.json();

    if(!d || d.success!==true){
      throw new Error((d&&d.error)||"Gabim gjatë ruajtjes");
    }

    alert("✅ U ruajt në Google Sheet.");
    closeForm();
    await loadData();

  }catch(e){
    alert("❌ "+e.message);
  }
}

async function deleteItem(rowNumber){
  if(!rowNumber){
    alert("❌ Mungon rowNumber.");
    return;
  }

  if(!confirm("Ta fshij këtë Info?")) return;

  const q=new URLSearchParams({
    action:"delete",
    pass:ADMIN_PASS,
    rowNumber:String(rowNumber)
  });

  try{
    const r=await fetch(API+"?"+q.toString()+"&t="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);

    const d=await r.json();

    if(!d || d.success!==true){
      throw new Error((d&&d.error)||"Gabim gjatë fshirjes");
    }

    alert("✅ U fshi nga Google Sheet.");
    await loadData();

  }catch(e){
    alert("❌ "+e.message);
  }
}
</script>
</body>
</html>
