    const tab={reg:'01_Rregullorja',rules:'01B_Rregullat_Xhami',docs:'02_Dokumentet'}[ENTRY_VIEW];

    try{setter(await readBundled(tab));show(ENTRY_VIEW);live.textContent='Përmbajtja e Xhamisë Frankenthal';live.style.color='#7fe3a7';}catch(e){live.textContent='Duke marrë përmbajtjen…';}
  }
  // Mos i dërgo 8 kërkesa njëherësh te Apps Script. Në telefon/WebView
  // kjo i linte disa kërkesa të skadonin dhe Ligjëratat dilnin 0.
  const viewTabs={reg:'01_Rregullorja',rules:'01B_Rregullat_Xhami',docs:'02_Dokumentet'};
  const selectedJobs=PUBLIC_VIEWS[ENTRY_VIEW]?jobs.filter(([tab])=>tab===viewTabs[ENTRY_VIEW]):jobs;
  for(const [tab,setter] of selectedJobs){
    try{
      const rows=await getTab(tab);
      setter(rows);
      ok++;
      live.textContent='● LIVE · '+ok+' / '+selectedJobs.length+' rubrika u lidhën';
    }catch(e){
      errs.push(tab+': '+(e?.message||e));
    }
  }
  if(!ruleRows.length) ruleRows=RULES_FALLBACK.slice();
  if(!docs.length) docs=DOCS_FALLBACK.slice();
  live.textContent=ok===selectedJobs.length
    ?'● LIVE · '+ok+' rubrika po lexohen nga Google Sheet'
    :'● LIVE · '+ok+'/'+selectedJobs.length+' rubrika · prek për riprovim';
  live.style.color=ok===selectedJobs.length?'#7fe3a7':'#ffd77a';
  if(bundledTabs.size){live.textContent='Përmbajtja e Xhamisë Frankenthal';live.style.color='#bdcec7';}
  live.title=errs.join('\n');
  live.onclick=()=>boot();
  show(PUBLIC_VIEWS[ENTRY_VIEW]?ENTRY_VIEW:'reg');
}

function openReader(kind,i){let x=readerSource(kind,i);R.title=x.title;R.sec=x.sec||10;R.lines=String(x.text||'').split(/\n+/).map(s=>s.trim()).filter(Boolean);R.i=0;document.getElementById('readerTitle').textContent=R.title+' · '+R.sec+' sek/rresht';renderReader();document.getElementById('reader').classList.add('show')}
function renderReader(){document.getElementById('readerBody').innerHTML=R.lines.map((x,i)=>`<div id="rr${i}" class="readerLine ${i===R.i?'active':''}">${E(x)}</div>`).join('');document.getElementById('readerProgress').style.width=(R.lines.length?((R.i+1)/R.lines.length*100):0)+'%';setTimeout(()=>document.getElementById('rr'+R.i)?.scrollIntoView({behavior:'smooth',block:'center'}),50)}
function startReader(){pauseReader();if(R.lines.length)R.t=setInterval(nextReader,R.sec*1000)}function pauseReader(){if(R.t){clearInterval(R.t);R.t=null}}function nextReader(){if(!R.lines.length)return;R.i=(R.i+1)%R.lines.length;renderReader()}function prevReader(){if(!R.lines.length)return;R.i=(R.i-1+R.lines.length)%R.lines.length;renderReader()}function restartReader(){R.i=0;renderReader()}function closeReader(){pauseReader();document.getElementById('reader').classList.remove('show')}
function renderAppt(){content.innerHTML=`<div class="sectionTitle"><h2>📅 Terminet e Hoxhës</h2><span class="status">${appointments.length} në Drive</span></div><div class="card"><h3>＋ Termin i ri</h3><div class="form"><label>Data<input id="aDate" type="date"></label><label>Ora<input id="aTime" type="time"></label><label>Shërbimi<select id="aSrv"><option>Mevlud</option><option>Nikah</option><option>Suneti</option><option>Akika</option><option>Varrim</option><option>Këshillim</option><option>Tjetër</option></select></label><label>Emri<input id="aName"></label><label>Telefoni<input id="aPhone"></label><label>Anëtar?<select id="aMem"><option>Po</option><option>Jo</option><option>Për t'u verifikuar</option></select></label><label>Pagesa €<input id="aPay" type="number" step="0.01"></label><label>Mënyra<select id="aMethod"><option>Cash</option><option>Bankë</option><option>PayPal</option><option>Pa pagesë</option></select></label><label>Referenca<input id="aRef"></label><label>Status<select id="aStatus"><option>Kërkuar</option><option>Në pritje të pagesës</option><option>Pagesa verifikuar</option><option>Konfirmuar</option><option>Kryer</option><option>Anuluar</option></select></label><label class="wide">Shënim<textarea id="aNote"></textarea></label></div><div class="actions"><button class="btn gold" onclick="saveAppt()">💾 RUAJ DIREKT NË DRIVE</button></div><div id="saveMsg" class="notice" style="margin-top:10px">Nuk ruhet në telefon. Sukses shfaqet vetëm pasi API kthen <b>ok:true</b>.</div></div><div style="height:14px"></div>${appointments.slice().reverse().map(a=>`<div class="appt"><b>${E(a.Data)} · ${E(a.Ora)} · ${E(a['Shërbimi'])}</b><div>${E(a.Emri)} · ${E(a.Telefoni)}</div><small>${E(a.Status)} · ${E(a['Mënyra'])}</small></div>`).join('')||'<div class="notice">Ende nuk ka termine në Drive.</div>'}`}
async function saveAppt(){let row={ID:'TRM-'+Date.now(),Data:aDate.value,Ora:aTime.value,'Shërbimi':aSrv.value,Emri:aName.value.trim(),Telefoni:aPhone.value.trim(),'Anëtar?':aMem.value,'Pagesa €':aPay.value,'Mënyra':aMethod.value,Referenca:aRef.value.trim(),Status:aStatus.value,'Shënim':aNote.value.trim()};if(!row.Data||!row.Ora||!row.Emri){saveMsg.textContent='❌ Data, ora dhe emri janë të detyrueshme.';saveMsg.classList.add('err');return}saveMsg.textContent='⏳ Duke shkruar në Google Sheet…';saveMsg.classList.remove('err');try{let r=await fetch(TERM_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({row})});let j=await r.json();if(!j.ok)throw Error(j.error||'API nuk e pranoi');row.ID=j.id||row.ID;row.Status='Kërkuar';appointments.push(row);renderAppt();let m=document.getElementById('saveMsg');if(m){m.textContent='✅ U ruajt direkt në Google Drive / 03_Terminet.';m.classList.remove('err')}}catch(e){saveMsg.textContent='❌ NUK U RUAJT NË DRIVE: '+e.message;saveMsg.classList.add('err')}}
boot();
</script></body></html>
